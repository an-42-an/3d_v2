<!DOCTYPE html>
<html>
    <head>
        <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    
    input {
    box-shadow: 0 0 5px #20bbd3;
    }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title >LOGIN</title> 
    </head>
<body class="d-flex justify-content-center align-items-center vh-100">
  <div style=" z-index:-1; position: absolute;  left:0%;  top:0%;  width:100.0%;  height:100.0%; background-color:black;"></div> 
 <div class="container">
  <div class="row ">
    <div class="col-lg-6 d-lg-block">
      <img src="static/login_bk_1.jpg" class="img-fluid h-100 w-100 object-fit-cover">
    </div>

    <div class="col-lg-6 d-flex flex-column justify-content-center align-items-center">

      <h1 class="text-center text-info mb-3">3D XO</h1>
      <h4 class="text-center text-info mb-4">{{msg}}</h4>

      <!-- form wasn't centered because no flex + inline styles -->
      <form action="/" method="POST" name="loginform"
            class="d-flex flex-column gap-2 mx-auto" style="max-width:300px; width:100%;">

        <label class="text-info">Username</label>
        <input type="text" name="user" required class="form-control">

        <!-- vw font made text tiny -->
        <label class="text-info">Password</label>
        <input type="password" name="pwd" required class="form-control">

        <button type="submit" class="btn btn-info mt-2 text-dark">
          Submit
        </button>
      </form>

      <a href="/create" class="text-info mt-3">
        Or create new account
      </a>

    </div>


    </div>
  </div>
</body>
